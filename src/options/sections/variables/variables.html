<div class="variables-page">

  <!-- Header -->
  <div class="section-header">
    <div class="section-header-left">
      <h2 class="section-title">Variables</h2>
      <p class="section-subtitle">Reusable values for request runners and cURL templates</p>
    </div>
    <div class="section-actions">
      <button id="exportVariablesBtn" class="btn btn-secondary btn-sm">
        <i class="fas fa-download"></i> Export
      </button>
      <label class="btn btn-secondary btn-sm" for="importVariablesInput">
        <i class="fas fa-upload"></i> Import
      </label>
      <input type="file" id="importVariablesInput" accept=".json" hidden>
      <button id="addVariableBtn" class="btn btn-primary btn-sm">
        <i class="fas fa-plus"></i> Add variable
      </button>
    </div>
  </div>

  <!-- Global toggles -->
  <div class="variables-controls">
    <div class="control-row">
      <span class="control-label">Variables enabled</span>
      <label class="toggle-switch">
        <input type="checkbox" id="variablesEnabled" checked>
        <span class="toggle-track"></span>
      </label>
    </div>
    <div class="control-row">
      <span class="control-label">Show sensitive values masked by default</span>
      <label class="toggle-switch">
        <input type="checkbox" id="maskSensitive" checked>
        <span class="toggle-track"></span>
      </label>
    </div>
  </div>

  <!-- Notification -->
  <div id="varNotification" class="var-notification" hidden></div>

  <!-- Variables list -->
  <div id="variablesListContainer" class="variables-list">
    <div class="empty-state">
      <i class="fas fa-dollar-sign"></i>
      <p>No variables yet</p>
      <p class="empty-hint">Click "Add variable" to define your first reusable value</p>
    </div>
  </div>

  <!-- Add/Edit modal -->
  <div id="variableModal" class="modal-overlay" hidden>
    <div class="modal-box">
      <div class="modal-header">
        <h3 id="modalTitle" class="modal-title">Add variable</h3>
        <button class="modal-close" id="modalCloseBtn" aria-label="Close">
          <i class="fas fa-times"></i>
        </button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label class="form-label" for="varName">Name <span class="required">*</span></label>
          <input type="text" id="varName" class="form-input" placeholder="BASE_URL" autocomplete="off">
          <p class="form-hint">Letters, numbers, underscores only. Used as <code>${'${'}NAME}</code>.</p>
        </div>
        <div class="form-group">
          <label class="form-label" for="varValue">Value <span class="required">*</span></label>
          <div class="value-wrap">
            <input type="text" id="varValue" class="form-input" placeholder="https://api.example.com" autocomplete="off">
            <button class="reveal-btn" id="toggleReveal" aria-label="Toggle visibility">
              <i class="fas fa-eye"></i>
            </button>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label" for="varDescription">Description</label>
          <input type="text" id="varDescription" class="form-input" placeholder="Optional description">
        </div>
        <div class="form-group form-row">
          <label class="form-label toggle-label">
            <label class="toggle-switch">
              <input type="checkbox" id="varSensitive">
              <span class="toggle-track"></span>
            </label>
            Mark as sensitive (mask value in lists)
          </label>
        </div>
      </div>
      <div class="modal-footer">
        <button id="modalCancelBtn" class="btn btn-ghost">Cancel</button>
        <button id="modalSaveBtn" class="btn btn-primary">Save</button>
      </div>
    </div>
  </div>

</div>
