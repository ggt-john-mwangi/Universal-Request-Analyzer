<div class="settings-page">

  <!-- Header -->
  <div class="section-header">
    <h2 class="section-title">Settings</h2>
    <div class="section-actions">
      <button id="settingsExportBtn" class="btn btn-secondary btn-sm">
        <i class="fas fa-download"></i> Export
      </button>
      <button id="settingsImportBtn" class="btn btn-secondary btn-sm">
        <i class="fas fa-upload"></i> Import
      </button>
      <button id="settingsResetBtn" class="btn btn-ghost btn-sm">
        <i class="fas fa-undo"></i> Reset
      </button>
      <button id="settingsSaveBtn" class="btn btn-primary btn-sm">
        <i class="fas fa-save"></i> Save
      </button>
    </div>
  </div>

  <!-- Notifications -->
  <div id="settingsNotification" class="settings-notification" hidden></div>

  <!-- Capture Card -->
  <details class="settings-card" open>
    <summary class="settings-card-header">
      <span class="card-icon"><i class="fas fa-circle-dot"></i></span>
      <span class="card-title">Capture</span>
      <span class="card-badge" id="captureBadge"></span>
      <i class="fas fa-chevron-down toggle-icon"></i>
    </summary>
    <div class="settings-card-body">
      <div class="setting-row">
        <label class="setting-label">
          <span class="label-text">Enable capture</span>
          <span class="label-desc">Record HTTP requests as they occur</span>
        </label>
        <label class="toggle-switch">
          <input type="checkbox" id="captureEnabled" data-setting="capture.enabled">
          <span class="toggle-track"></span>
        </label>
      </div>

      <div class="setting-row">
        <label class="setting-label" for="maxStoredRequests">
          <span class="label-text">Max stored requests</span>
          <span class="label-desc">Older requests are pruned when limit is reached</span>
        </label>
        <input type="number" id="maxStoredRequests" class="setting-input setting-input-sm"
          data-setting="general.maxStoredRequests" min="100" max="1000000" step="1000">
      </div>

      <div class="setting-row">
        <label class="setting-label">
          <span class="label-text">Track only configured sites</span>
          <span class="label-desc">Only capture requests from domains in your include list</span>
        </label>
        <label class="toggle-switch">
          <input type="checkbox" id="trackOnlyConfiguredSites" data-setting="capture.trackOnlyConfiguredSites">
          <span class="toggle-track"></span>
        </label>
      </div>

      <div class="setting-row setting-row-column">
        <label class="setting-label">
          <span class="label-text">Capture types</span>
        </label>
        <div class="checkbox-grid" id="captureTypeCheckboxes">
          <label class="checkbox-chip"><input type="checkbox" value="xmlhttprequest"> XHR</label>
          <label class="checkbox-chip"><input type="checkbox" value="fetch"> Fetch</label>
          <label class="checkbox-chip"><input type="checkbox" value="document"> Document</label>
          <label class="checkbox-chip"><input type="checkbox" value="script"> Script</label>
          <label class="checkbox-chip"><input type="checkbox" value="stylesheet"> Stylesheet</label>
          <label class="checkbox-chip"><input type="checkbox" value="image"> Image</label>
          <label class="checkbox-chip"><input type="checkbox" value="font"> Font</label>
          <label class="checkbox-chip"><input type="checkbox" value="other"> Other</label>
        </div>
      </div>
    </div>
  </details>

  <!-- Filters Card -->
  <details class="settings-card">
    <summary class="settings-card-header">
      <span class="card-icon"><i class="fas fa-filter"></i></span>
      <span class="card-title">Filters</span>
      <i class="fas fa-chevron-down toggle-icon"></i>
    </summary>
    <div class="settings-card-body">
      <div class="setting-row setting-row-column">
        <label class="setting-label" for="includeDomains">
          <span class="label-text">Include domains</span>
          <span class="label-desc">Comma-separated. Leave empty to capture all domains.</span>
        </label>
        <textarea id="includeDomains" class="setting-textarea" data-setting="capture.captureFilters.includeDomains"
          placeholder="github.com, api.example.com" rows="3"></textarea>
      </div>

      <div class="setting-row setting-row-column">
        <label class="setting-label" for="excludeDomains">
          <span class="label-text">Exclude domains</span>
          <span class="label-desc">Comma-separated. These are always skipped.</span>
        </label>
        <textarea id="excludeDomains" class="setting-textarea" data-setting="capture.captureFilters.excludeDomains"
          placeholder="chrome://*,  chrome-extension://*" rows="3"></textarea>
      </div>
    </div>
  </details>

  <!-- Display Card -->
  <details class="settings-card">
    <summary class="settings-card-header">
      <span class="card-icon"><i class="fas fa-chart-bar"></i></span>
      <span class="card-title">Display &amp; Charts</span>
      <i class="fas fa-chevron-down toggle-icon"></i>
    </summary>
    <div class="settings-card-body">
      <div class="setting-row">
        <label class="setting-label">
          <span class="label-text">Show charts</span>
          <span class="label-desc">Enable chart visualizations on the dashboard</span>
        </label>
        <label class="toggle-switch">
          <input type="checkbox" id="showCharts" data-setting="display.showCharts">
          <span class="toggle-track"></span>
        </label>
      </div>

      <div class="setting-row setting-row-column" id="chartTypesRow">
        <label class="setting-label">
          <span class="label-text">Enabled chart types</span>
        </label>
        <div class="checkbox-grid" id="plotTypeCheckboxes">
          <label class="checkbox-chip"><input type="checkbox" value="requestTimeline"> Timeline</label>
          <label class="checkbox-chip"><input type="checkbox" value="statusCodes"> Status codes</label>
          <label class="checkbox-chip"><input type="checkbox" value="responseTime"> Response time</label>
          <label class="checkbox-chip"><input type="checkbox" value="requestTypes"> Request types</label>
          <label class="checkbox-chip"><input type="checkbox" value="topDomains"> Top domains</label>
          <label class="checkbox-chip"><input type="checkbox" value="errorRate"> Error rate</label>
        </div>
      </div>
    </div>
  </details>

  <!-- Export Card -->
  <details class="settings-card">
    <summary class="settings-card-header">
      <span class="card-icon"><i class="fas fa-file-export"></i></span>
      <span class="card-title">Export</span>
      <i class="fas fa-chevron-down toggle-icon"></i>
    </summary>
    <div class="settings-card-body">
      <div class="setting-row">
        <label class="setting-label">
          <span class="label-text">Auto-export</span>
          <span class="label-desc">Periodically export captured data automatically</span>
        </label>
        <label class="toggle-switch">
          <input type="checkbox" id="autoExport" data-setting="general.autoExport">
          <span class="toggle-track"></span>
        </label>
      </div>

      <div id="autoExportOptions">
        <div class="setting-row">
          <label class="setting-label" for="exportFormat">
            <span class="label-text">Format</span>
          </label>
          <select id="exportFormat" class="setting-select" data-setting="general.defaultExportFormat">
            <option value="json">JSON</option>
            <option value="csv">CSV</option>
            <option value="har">HAR</option>
          </select>
        </div>

        <div class="setting-row">
          <label class="setting-label" for="exportInterval">
            <span class="label-text">Interval (minutes)</span>
          </label>
          <input type="number" id="exportInterval" class="setting-input setting-input-sm"
            data-setting="general.autoExportInterval" min="1" max="1440" value="60">
        </div>

        <div class="setting-row setting-row-column">
          <label class="setting-label" for="exportPath">
            <span class="label-text">Export path</span>
            <span class="label-desc">Leave empty for browser default Downloads folder</span>
          </label>
          <input type="text" id="exportPath" class="setting-input"
            data-setting="general.exportPath" placeholder="e.g. C:\Users\you\Downloads\URA">
        </div>
      </div>
    </div>
  </details>

  <!-- Retention Card -->
  <details class="settings-card">
    <summary class="settings-card-header">
      <span class="card-icon"><i class="fas fa-clock-rotate-left"></i></span>
      <span class="card-title">Retention</span>
      <i class="fas fa-chevron-down toggle-icon"></i>
    </summary>
    <div class="settings-card-body">
      <div class="setting-row">
        <label class="setting-label" for="retentionDays">
          <span class="label-text">Keep data for (days)</span>
          <span class="label-desc">Records older than this are removed during daily cleanup</span>
        </label>
        <input type="number" id="retentionDays" class="setting-input setting-input-sm"
          data-setting="retention.retentionDays" min="1" max="365" value="30">
      </div>

      <div class="setting-row">
        <label class="setting-label">
          <span class="label-text">Auto-cleanup</span>
          <span class="label-desc">Remove stale data automatically during daily processing</span>
        </label>
        <label class="toggle-switch">
          <input type="checkbox" id="autoCleanup" data-setting="retention.autoCleanup">
          <span class="toggle-track"></span>
        </label>
      </div>
    </div>
  </details>

  <!-- Import/Export Profile Card -->
  <details class="settings-card">
    <summary class="settings-card-header">
      <span class="card-icon"><i class="fas fa-arrows-rotate"></i></span>
      <span class="card-title">Import / Export Profile</span>
      <i class="fas fa-chevron-down toggle-icon"></i>
    </summary>
    <div class="settings-card-body">
      <p class="settings-hint">Export all settings to a JSON file for backup or sharing across devices. Import merges settings — your data is never deleted.</p>

      <div class="import-export-actions">
        <button id="exportSettingsBtn" class="btn btn-secondary">
          <i class="fas fa-download"></i> Export settings
        </button>
        <label class="btn btn-secondary" for="importFileInput">
          <i class="fas fa-upload"></i> Import settings
        </label>
        <input type="file" id="importFileInput" accept=".json" hidden>
      </div>

      <!-- Import diff preview -->
      <div id="importDiffPanel" class="import-diff-panel" hidden>
        <div class="diff-header">
          <span class="diff-title">Changes to apply</span>
          <span class="diff-count" id="diffCount"></span>
        </div>
        <div class="diff-table-wrap">
          <table class="diff-table">
            <thead>
              <tr><th>Section</th><th>Key</th><th>Current</th><th>Importing</th></tr>
            </thead>
            <tbody id="diffTableBody"></tbody>
          </table>
        </div>
        <div class="diff-actions">
          <button id="cancelImportBtn" class="btn btn-ghost">Cancel</button>
          <button id="confirmImportBtn" class="btn btn-primary">Apply import</button>
        </div>
      </div>
    </div>
  </details>

</div>
